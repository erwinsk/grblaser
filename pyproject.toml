[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grblaser"
dynamic = ["version"]
description = "Perangkat lunak laser GRBL untuk Linux: layer per warna dan raster gambar ke G-code (PyQt5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["grbl", "laser", "gcode", "cnc", "engraving", "pyqt5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["PyQt5>=5.15", "pyserial>=3.5", "Pillow>=10", "numpy>=1.24", "svgelements>=1.9", "ezdxf>=1.1"]

[project.optional-dependencies]
shapes = ["shapely>=2.0"]
dev = ["pytest>=7", "shapely>=2.0"]

[project.scripts]
grblaser = "grblaser.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "grblaser.__version__" }

[tool.setuptools.packages.find]
include = ["grblaser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
